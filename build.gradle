plugins {
    id "java"
    id "maven-publish"
    id "net.kyori.indra" version "2.1.1"
    id "com.jfrog.artifactory" version "4.28.2"
    id "org.jetbrains.kotlin.jvm" version "1.7.10"
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

ext {
    def getGitHash = { ->
        def stdout = new ByteArrayOutputStream()

        exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            standardOutput = stdout
        }

        return stdout.toString().trim()
    }

    def getGitBranch = { ->
        def stdout = new ByteArrayOutputStream()

        exec {
            commandLine 'git', 'rev-parse', '--abbrev-ref', 'HEAD'
            standardOutput = stdout
        }

        return stdout.toString().trim()
    }

    gitHash = getGitHash
    gitBranch = getGitBranch
}

allprojects {
    group "gg.scala.spigot"
    version "1.1.0"

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: "maven-publish"
    apply plugin: "java"
    apply plugin: "org.jetbrains.kotlin.jvm"
    apply plugin: "com.github.johnrengelman.shadow"

    apply plugin: "com.jfrog.artifactory"

    compileKotlin {
        kotlinOptions.javaParameters = true
        kotlinOptions.jvmTarget = "17"
    }

    compileJava {
        options.compilerArgs += ["-parameters"]
        options.fork = true
    }

    shadowJar {
        archiveClassifier.set("")

        exclude "**/*.kotlin_metadata"
        exclude "**/*.kotlin_module"

        archiveFileName = "scala-spigot-${project.name}.jar"
    }

    publishing {
        publications {
            shadow(MavenPublication) { publication ->
                project.shadow.component(publication)
            }
        }

        repositories {
            maven {
                name "Scala"
                url "${property("artifactory_contextUrl")}/gradle-release"

                credentials {
                    username property("artifactory_user")
                    password property("artifactory_password")
                }
            }
        }
    }

    tasks.build.dependsOn(
        shadowJar,
        publishShadowPublicationToScalaRepository
    )
}

artifactory {
    this.contextUrl = property("artifactory_contextUrl")

    publish {
        repository {
            repoKey = property("artifactory_release_local")
            username = property("artifactory_user")
            password = property("artifactory_password")
            maven = true
        }
    }
}
