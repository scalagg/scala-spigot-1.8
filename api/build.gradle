repositories {
    maven {
        url "https://maven.elmakers.com/repository/"
    }
}

dependencies {
    compileOnly "net.sf.trove4j:trove4j:3.0.3"

    implementation 'commons-lang:commons-lang:2.6'
    implementation "com.googlecode.json-simple:json-simple:1.1.1"

    compileOnly("org.ow2.asm:asm:9.4") // PandaSpigot
    compileOnly("org.ow2.asm:asm-commons:9.4") // PandaSpigot

    compileOnly 'net.kyori:adventure-platform-bukkit:4.1.2'
    compileOnly 'net.kyori:adventure-api:4.11.0'

    implementation 'com.google.guava:guava:31.1-jre'
    implementation 'com.google.code.gson:gson:2.9.1'

    implementation 'org.avaje.ebean:ebean:9.5.1'
    implementation 'org.yaml:snakeyaml:1.30'
    implementation 'net.md-5:bungeecord-chat:1.16-R0.4'

    compileOnly project(":core")
}
