plugins {
    id 'java'
}

description = "An enhanced plugin API for Minecraft servers."

repositories {
    maven {
        url "https://maven.elmakers.com/repository/"
    }
}

dependencies {
    compileOnly "net.sf.trove4j:trove4j:3.0.3"

    implementation 'commons-lang:commons-lang:2.6'
    implementation "com.googlecode.json-simple:json-simple:1.1.1"

    compileOnly 'net.kyori:adventure-platform-bukkit:4.0.1'
    compileOnly "net.kyori:adventure-api:4.9.3"

    implementation 'com.google.guava:guava:31.0.1-jre'
    implementation 'com.google.code.gson:gson:2.8.9'

    implementation 'org.avaje.ebean:ebean:9.5.1'
    implementation 'org.yaml:snakeyaml:1.29'
    implementation 'net.md-5:bungeecord-chat:1.16-R0.4'

    compileOnly project(":sspigot-core")
}

def targetJavaVersion = 8
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release = targetJavaVersion
    }
}
