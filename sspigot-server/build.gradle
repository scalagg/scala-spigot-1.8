import com.github.jengelman.gradle.plugins.shadow.transformers.Log4j2PluginsCacheFileTransformer

plugins {
    id "application"
}

repositories {
    maven {
        url "https://maven.elmakers.com/repository/"
    }
    maven {
        url "https://hub.spigotmc.org/nexus/content/groups/public/"
    }
    maven {
        url "https://ci.destroystokyo.com/plugin/repository/everything/"
    }
    maven {
        url "https://repository.apache.org/content/groups/snapshots/"
    }
    maven {
        url "https://repo.velocitypowered.com/snapshots/"
    }

    mavenCentral()
}

application {
    mainClassName "org.bukkit.craftbukkit.v1_8_R3.Main"
}

publishing {
    manifest {
        attributes 'Multi-Release': 'true'
    }
}

manifest {
    attributes 'Multi-Release': 'true'
}

dependencies {
    implementation project(":sspigot-api")
    implementation project(":sspigot-core")

    implementation "org.spigotmc:minecraft-server:1.8.8-SNAPSHOT"

    implementation "net.sf.jopt-simple:jopt-simple:5.0.4"
    implementation "net.sf.trove4j:trove4j:3.0.3"

    implementation "com.eatthepath:fast-uuid:0.2.0"
    implementation 'it.unimi.dsi:fastutil:8.5.6'

    // ScalaSpigot start
    implementation fileTree("lib")

    implementation 'net.kyori:adventure-platform-bukkit:4.0.1'
    implementation "net.kyori:adventure-api:4.9.3"

    implementation 'org.jline:jline-reader:3.20.0'
    implementation 'org.jline:jline-terminal:3.20.0'

    runtimeOnly 'org.jline:jline-terminal-jna:3.20.0'
    // ScalaSpigot end

    implementation "org.xerial:sqlite-jdbc:3.36.0.2"
    implementation "mysql:mysql-connector-java:8.0.25"
    implementation "org.fusesource.jansi:jansi:2.4.0"

    implementation "net.jafama:jafama:2.3.2"

    compileOnly "commons-lang:commons-lang:2.6"
    compileOnly "com.googlecode.json-simple:json-simple:1.1.1"

    compileOnly "com.google.guava:guava:31.0.1-jre"
    compileOnly "com.google.code.gson:gson:2.8.9"

    compileOnly "org.avaje.ebean:ebean:9.5.1"
    compileOnly "org.yaml:snakeyaml:1.29"
    compileOnly "net.md-5:bungeecord-chat:1.16-R0.4"

    compileOnly "org.projectlombok:lombok:1.18.22"
    annotationProcessor "org.projectlombok:lombok:1.18.22"

    implementation 'org.apache.logging.log4j:log4j-core:2.17.0'

    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.6.0"
}

shadowJar {
    archiveClassifier.set("")

    exclude "org.bukkit.craftbukkit.Main*"
    exclude "**/*.kotlin_metadata"
    exclude "**/*.kotlin_builtins"

    transform(Log4j2PluginsCacheFileTransformer)

    relocate "org.bukkit.craftbukkit", "org.bukkit.craftbukkit.v1_8_R3"
    relocate "net.minecraft.server", "net.minecraft.server.v1_8_R3"
    relocate "gg.scala.server", "gg.scala.server.v1_8_R3"

    archiveFileName = "scala-spigot-server.jar"
}

def targetJavaVersion = 8
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release = targetJavaVersion as Property<Integer>
    }
}

compileKotlin {
    kotlinOptions {
        jvmTarget = "1.8"
    }
}
