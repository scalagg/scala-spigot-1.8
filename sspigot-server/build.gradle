plugins {
    id 'java'
    id "maven-publish"
    id 'com.github.johnrengelman.shadow' version '6.1.0'
}

repositories {
    maven {
        url "https://maven.elmakers.com/repository/"
    }
    maven {
        url "https://hub.spigotmc.org/nexus/content/groups/public/"
    }
    maven {
        url "https://ci.destroystokyo.com/plugin/repository/everything/"
    }
}

dependencies {
    implementation project(":sspigot-api")
    implementation project(":sspigot-core")

    implementation "org.spigotmc:minecraft-server:1.8.8-SNAPSHOT"
    implementation 'net.sf.jopt-simple:jopt-simple:5.0.4'
    implementation 'jline:jline:2.14.6'
    implementation 'org.xerial:sqlite-jdbc:3.36.0.2'
    implementation 'mysql:mysql-connector-java:8.0.25'

    implementation 'net.jafama:jafama:2.3.2'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
}

shadowJar {
    archiveClassifier.set("")

    relocate 'joptsimple', 'org.bukkit.craftbukkit.libs.joptsimple'
    relocate 'jline', 'org.bukkit.craftbukkit.libs.jline'
    relocate 'org.ibex', 'org.bukkit.craftbukkit.libs.org.ibex'
    relocate 'org.gjt', 'org.bukkit.craftbukkit.libs.org.gjt'

    exclude "org.bukkit.craftbukkit.Main*"
    exclude "**/*.kotlin_metadata"
    exclude "**/*.kotlin_builtins"
    exclude "META-INF/"

    relocate 'org.bukkit.craftbukkit', 'org.bukkit.craftbukkit.v1_8_R3'
    relocate 'net.minecraft.server', 'net.minecraft.server.v1_8_R3'
    relocate 'gg.scala.server', 'gg.scala.server.v1_8_R3'

    archiveFileName = "scala-spigot-server.jar"
}

publishing {
    publications {
        shadow(MavenPublication) { publication ->
            project.shadow.component(publication)
        }
    }
}

tasks.build.dependsOn(shadowJar, publishing)


test {
    useJUnitPlatform()
}

def targetJavaVersion = 8
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release = targetJavaVersion
    }
}
