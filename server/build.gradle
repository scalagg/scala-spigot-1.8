import com.github.jengelman.gradle.plugins.shadow.transformers.Log4j2PluginsCacheFileTransformer

repositories {
    maven {
        url "https://maven.elmakers.com/repository/"
    }
    maven {
        url "https://hub.spigotmc.org/nexus/content/groups/public/"
    }
    maven {
        url "https://repository.apache.org/content/groups/snapshots/"
    }
    maven {
        url "https://repo.velocitypowered.com/snapshots/"
        content {
            includeGroupByRegex "com\\.mojang.*"
        }
    }

    mavenCentral()
}

dependencies {
    implementation project(":api")
    implementation project(":core")

    implementation "net.sf.jopt-simple:jopt-simple:5.0.4"
    implementation "net.sf.trove4j:trove4j:3.0.3"

    implementation "com.github.chhh:javolution-core-java-msftbx:6.11.8"

    implementation "com.eatthepath:fast-uuid:0.2.0"
    implementation "it.unimi.dsi:fastutil:8.5.8"

    implementation "io.netty:netty-all:4.1.92.Final"

    implementation("io.netty.incubator:netty-incubator-transport-native-io_uring:0.0.21.Final:linux-x86_64")
    implementation("io.netty.incubator:netty-incubator-transport-native-io_uring:0.0.21.Final:linux-aarch_64")

    implementation "commons-io:commons-io:2.11.0"
    implementation "org.apache.commons:commons-lang3:3.12.0"
    implementation "commons-codec:commons-codec:1.15"

    implementation("org.ow2.asm:asm:9.4") // PandaSpigot
    implementation("org.ow2.asm:asm-commons:9.4") // PandaSpigot

    // ScalaSpigot start
    implementation "org.apache.logging.log4j:log4j-core:2.20.0"
    implementation "org.apache.logging.log4j:log4j-iostreams:2.20.0"
    implementation "org.apache.logging.log4j:log4j-api:2.20.0"

    implementation fileTree("lib")
    implementation "com.mojang:authlib:1.11"

    implementation "net.minecrell:terminalconsoleappender:1.3.0"
    implementation "org.jline:jline-terminal-jansi:3.21.0"

    implementation "org.jetbrains.kotlin:kotlin-reflect:1.8.0"
    implementation "javax.xml.bind:jaxb-api:2.4.0-b180830.0359"

    implementation "net.kyori:adventure-platform-bukkit:4.1.2"
    implementation "net.kyori:adventure-api:4.11.0"
    // ScalaSpigot end

    implementation "org.xerial:sqlite-jdbc:3.39.3.0"
    implementation "mysql:mysql-connector-java:8.0.30"

    implementation "net.jafama:jafama:2.3.2"

    compileOnly "commons-lang:commons-lang:2.6"
    compileOnly "com.googlecode.json-simple:json-simple:1.1.1"

    compileOnly "com.google.guava:guava:31.1-jre"
    compileOnly "com.google.code.gson:gson:2.9.1"

    compileOnly "org.avaje.ebean:ebean:9.5.1"
    compileOnly "org.yaml:snakeyaml:1.32"
    compileOnly "net.md-5:bungeecord-chat:1.16-R0.4"

    compileOnly "org.projectlombok:lombok:1.18.24"
    annotationProcessor "org.projectlombok:lombok:1.18.24"

    implementation "io.sentry:sentry:6.4.2"

    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.20"
    implementation "org.jetbrains.kotlin:kotlin-reflect:1.8.20"
}

processResources {
    filter { String line ->
        line
            .replace("<version>", "${gitHash}")
            .replace("<branch>", "${gitBranch}")
    }
}

shadowJar {
    manifest {
        attributes "Multi-Release": "true"
        attributes "Main-Class": "org.bukkit.craftbukkit.v1_8_R3.Main"
    }

    archiveClassifier.set("")

    exclude "org.bukkit.craftbukkit.Main*"
    exclude "**/*.kotlin_metadata"

    exclude "**/com/fasterxml/**"

    append "META-INF/io.netty.versions.properties"
    transform(Log4j2PluginsCacheFileTransformer)

    relocate "org.bukkit.craftbukkit", "org.bukkit.craftbukkit.v1_8_R3"
    relocate "net.minecraft.server", "net.minecraft.server.v1_8_R3"
    relocate "gg.scala.server", "gg.scala.server.v1_8_R3"
}
